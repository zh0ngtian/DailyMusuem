name: DailyMuseum

options:
  bundleIdPrefix: tech.zh0ngtian
  deploymentTarget:
    iOS: "17.0"

targets:
  DailyMuseum:
    type: application
    platform: iOS
    sources:
      - path: DailyMuseum
      - path: Shared
    info:
      path: DailyMuseum/Info.plist
      properties:
        CFBundleDisplayName: DailyMuseum
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleURLTypes:
          - CFBundleURLName: DailyMuseumDeepLink
            CFBundleURLSchemes:
              - dailymuseum
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: DailyMuseum/DailyMuseum.entitlements
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: tech.zh0ngtian.DailyMuseum
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    dependencies:
      - target: DailyMuseumWidgetExtension
        embed: true

  DailyMuseumWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: DailyMuseumWidget
      - path: Shared
    info:
      path: DailyMuseumWidget/Info.plist
      properties:
        CFBundleDisplayName: DailyMuseumWidget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: DailyMuseumWidget/DailyMuseumWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.zh0ngtian.DailyMuseum.widget
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
