name: DailyMuseum

options:
  bundleIdPrefix: tech.zh0ngtian
  deploymentTarget:
    iOS: "18.0"

configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig

targets:
  DailyMuseum:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    sources:
      - path: DailyMuseum
      - path: DailyMuseumWidget/WidgetArtworkSnapshotStore.swift
      - path: DailyMuseumWidget/WidgetRefreshDeliveryTracker.swift
      - path: DailyMuseumWidget/WidgetSettingsReader.swift
      - path: Shared
    info:
      path: DailyMuseum/Info.plist
      properties:
        CFBundleDisplayName: MuseumMuse
        CFBundleName: MuseumMuse
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        MuseumBackendBaseURL: "https://museummuse-api.305301890.workers.dev"
        MuseumBackendSimpleAuthSecret: "$(MUSEUMMUSE_SIMPLE_AUTH_SECRET)"
        CFBundleURLTypes:
          - CFBundleURLName: DailyMuseumDeepLink
            CFBundleURLSchemes:
              - dailymuseum
        NSPhotoLibraryAddUsageDescription: 允许保存展品图片到系统相册
        LSApplicationQueriesSchemes:
          - weixin
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: DailyMuseum/DailyMuseum.entitlements
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: tech.zh0ngtian.DailyMuseum
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    dependencies:
      - target: DailyMuseumWidgetExtension
        embed: true

  DailyMuseumWidgetExtension:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    sources:
      - path: DailyMuseumWidget
      - path: Shared
    info:
      path: DailyMuseumWidget/Info.plist
      properties:
        CFBundleDisplayName: DailyMuseumWidget
        MuseumBackendBaseURL: "https://museummuse-api.305301890.workers.dev"
        MuseumBackendSimpleAuthSecret: "$(MUSEUMMUSE_SIMPLE_AUTH_SECRET)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: DailyMuseumWidget/DailyMuseumWidgetAppGroup.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.zh0ngtian.DailyMuseum.widget
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"

  DailyMuseumTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DailyMuseumTests
      - path: Shared/AppDeepLink.swift
      - path: Shared/Artwork.swift
      - path: Shared/ArtworkShareSnapshot.swift
      - path: Shared/ArtworkFeed/ArtworkFeedCache.swift
      - path: Shared/ArtworkFeed/ArtworkFeedItem.swift
      - path: Shared/ArtworkFeed/ArtworkFeedViewModel.swift
      - path: Shared/Backend/MuseumBackendClient.swift
      - path: Shared/Museum.swift
      - path: Shared/MuseumMetadata.swift
      - path: Shared/MuseumMetadataStore.swift
      - path: Shared/MuseumRequestCachePolicy.swift
      - path: Shared/Logging/LogTimestampFormatter.swift
      - path: Shared/Logging/RequestLogger.swift
      - path: Shared/Settings/FavoritesStore.swift
      - path: Shared/Settings/SettingsKeys.swift
      - path: Shared/Settings/SettingsStore.swift
      - path: Shared/Settings/WidgetConfigurationIntent.swift
      - path: Shared/Settings/WidgetMuseumScope.swift
      - path: DailyMuseumWidget/WidgetArtworkSnapshotStore.swift
      - path: DailyMuseumWidget/WidgetRefreshDeliveryTracker.swift
      - path: DailyMuseumWidget/WidgetSettingsReader.swift
    resources:
      - path: DailyMuseumTests/Fixtures
    dependencies:
      - target: DailyMuseum
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: tech.zh0ngtian.DailyMuseumTests
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
