name: iOS Build

on:
  push:
    branches:
      - '**'
    paths:
      - 'DailyMuseum/**'
      - 'DailyMuseumWidget/**'
      - 'Shared/**'
      - 'DailyMuseumTests/**'
      - 'DailyMuseum.xcodeproj/**'
      - 'Config/**'
      - 'Project.yml'
  pull_request:
    paths:
      - 'DailyMuseum/**'
      - 'DailyMuseumWidget/**'
      - 'Shared/**'
      - 'DailyMuseumTests/**'
      - 'DailyMuseum.xcodeproj/**'
      - 'Config/**'
      - 'Project.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'museummuse-production-build' || format('museummuse-development-build-{0}', github.ref) }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: Build
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive
      - name: Check build context
        id: batch
        run: python3 scripts/verify_release_batch.py --sha "$GITHUB_SHA" --allow-unfrozen --github-output "$GITHUB_OUTPUT"
      - name: Build unsigned iOS Release
        if: steps.batch.outputs.build_required == 'true'
        env:
          MUSEUMMUSE_SIMPLE_AUTH_SECRET: ci-build-only-placeholder
        run: bash scripts/check_ios_build.sh
      - name: Upload failed build logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-build-failure-${{ github.run_attempt }}
          path: build/ci/*.log
          if-no-files-found: warn
          retention-days: 7
