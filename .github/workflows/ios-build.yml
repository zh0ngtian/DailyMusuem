name: iOS Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.variant }})
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, compatibility]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build App, Widget and simulator test targets
        run: bash scripts/check_ios_build.sh "${{ matrix.variant }}"
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-build-${{ matrix.variant }}-${{ github.run_attempt }}
          path: |
            build/ci/${{ matrix.variant }}/*.log
            build/ci/${{ matrix.variant }}/*.xcresult
          if-no-files-found: warn
          retention-days: 7
