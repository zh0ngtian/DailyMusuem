name: iOS Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: museummuse-production-release
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: Build
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      BUILD_SHA: ${{ github.sha }}
      RELEASE_TAG: ${{ github.ref_name }}
      REQUIRE_RELEASE_BATCH_CLIENT: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive
      - name: Verify frozen client batch
        run: python3 scripts/verify_release_batch.py --sha "$BUILD_SHA" --require-client --release-tag "$RELEASE_TAG"
      - name: Build unsigned iOS Release
        env:
          MUSEUMMUSE_SIMPLE_AUTH_SECRET: ${{ secrets.MUSEUMMUSE_SIMPLE_AUTH_SECRET }}
        run: bash scripts/check_ios_build.sh
      - name: Check version and package unsigned IPA
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_SHA: ${{ github.sha }}
          AUTH_CONFIGURED: ${{ secrets.MUSEUMMUSE_SIMPLE_AUTH_SECRET != '' }}
        run: bash scripts/package_ios_release.sh
      - name: Upload unsigned release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-release-${{ github.run_attempt }}
          path: |
            build/ci/MuseumMuse-unsigned.ipa
            build/ci/MuseumMuse-unsigned.ipa.sha256
            build/ci/MuseumMuse-unsigned.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload failed build logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-release-failure-${{ github.run_attempt }}
          path: build/ci/*.log
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Publish unsigned IPA
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      BUILD_SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      AUTH_CONFIGURED: ${{ secrets.MUSEUMMUSE_SIMPLE_AUTH_SECRET != '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify frozen publication context
        run: python3 scripts/verify_release_batch.py --sha "$BUILD_SHA" --require-client --release-tag "$RELEASE_TAG"
      - name: Download unsigned release package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ios-release-${{ github.run_attempt }}
          path: packages
      - name: Verify and publish immutable release
        run: python3 scripts/publish_github_release.py --packages packages
