name: iOS Regression

on:
  workflow_dispatch:
    inputs:
      destination:
        description: Simulator destination for Swift regression
        required: true
        default: 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Swift and Python regression
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      MUSEUMMUSE_SIMPLE_AUTH_SECRET: ci-build-only-placeholder
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Prepare Python dependencies
        run: |
          python3 -m venv build/regression-venv
          build/regression-venv/bin/python -m pip install -r server/requirements.txt
      - name: Run Python regression
        run: |
          set -euo pipefail
          mkdir -p build/regression
          test_status=0
          build/regression-venv/bin/python -m unittest discover -s server -p 'test_*.py' 2>&1 | tee build/regression/server.log || test_status=$?
          build/regression-venv/bin/python -m unittest discover -s scripts/tests -p 'test_*.py' 2>&1 | tee build/regression/scripts.log || test_status=$?
          exit "$test_status"
      - name: Run Swift simulator regression
        if: ${{ !cancelled() }}
        env:
          TEST_DESTINATION: ${{ inputs.destination }}
        run: |
          set -euo pipefail
          mkdir -p build/regression
          xcodebuild -version | tee build/regression/toolchain.log
          xcodebuild -showsdks | tee -a build/regression/toolchain.log
          xcodebuild -project DailyMuseum.xcodeproj -scheme DailyMuseumTests \
            -configuration Debug -destination "$TEST_DESTINATION" \
            -derivedDataPath build/regression/derived-data \
            -resultBundlePath build/regression/tests.xcresult \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO \
            MUSEUMMUSE_SIMPLE_AUTH_SECRET=ci-build-only-placeholder \
            test 2>&1 | tee build/regression/swift.log
      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-regression-${{ github.run_attempt }}
          path: |
            build/regression/*.log
            build/regression/*.xcresult
          if-no-files-found: warn
          retention-days: 7
